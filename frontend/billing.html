<main><h2>Generate Bill</h2><form id="billForm" class="form-grid"><input id="bpatient" type="number" placeholder="Patient ID" required><input id="bconsult" type="number" step="0.01" placeholder="Consultation Fee"><input id="bmedicine" type="number" step="0.01" placeholder="Medicine Fee"><input id="blab" type="number" step="0.01" placeholder="Lab Fee"><button>Generate Bill</button></form><p id="message"></p>
<table><thead><tr><th>ID</th><th>Patient</th><th>Consultation</th><th>Medicine</th><th>Lab</th><th>Total</th><th>Date</th></tr></thead><tbody id="billTable"></tbody></table></main>
<script src="js/script.js"></script><script>document.getElementById('billForm').addEventListener('submit',addBill);loadBills();</script>
